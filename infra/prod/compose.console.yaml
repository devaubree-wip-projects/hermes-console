name: hermes-console-product

# Client-owned deliverable: Console web + Postgres + Caddy (TLS). Run from the repo
# root so relative paths resolve correctly, e.g.:
#   docker compose --project-directory . -f infra/prod/compose.console.yaml up -d
# This stack never references the local dev infra (infra-*, dev-shared-net) — those
# only exist on the maintainers' machine, not at a client site.

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *prod-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      # infra/prod/backup-postgres.sh dumps/restores through this same directory.
      - type: bind
        source: ${HERMES_DB_BACKUP_DIR:-./backups/postgres}
        target: /backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # No "ports:" on purpose: only reachable from other services on console-net.
    networks:
      - console-net

  uploads-init:
    image: alpine:3
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "chown 10000:10000 /uploads && chmod 700 /uploads"]
    volumes:
      - type: volume
        source: uploads-data
        target: /uploads
    restart: "no"

  hermes-console-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${HERMES_CONSOLE_WEB_IMAGE:-hermes-console-web:latest}
    restart: unless-stopped
    logging: *prod-logging
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Product uploads must survive image replacement and are streamed to an
      # authenticated Edge when a Work run materializes its resources.
      UPLOAD_DIR: /var/lib/hermes-console/uploads
      # Overrides any DATABASE_URL from .env: the product Postgres always lives on
      # console-net under the "postgres" service name in this stack.
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: uploads-data
        target: /var/lib/hermes-console/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - console-net

  caddy:
    # Sur un hôte qui a déjà un reverse proxy sur 80/443, démarrer celui-ci
    # casserait les sites existants. Il n'est donc lancé qu'à la demande, via
    # `--profile standalone-proxy` (ce que fait install-server.sh par défaut) ;
    # le mode --shared-proxy l'omet et raccorde `web` au proxy en place.
    profiles: ["standalone-proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *prod-logging
    depends_on:
      hermes-console-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HERMES_CONSOLE_DOMAIN: ${HERMES_CONSOLE_DOMAIN:?set HERMES_CONSOLE_DOMAIN}
    volumes:
      - type: bind
        source: infra/prod/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: volume
        source: caddy-data
        target: /data
      - type: volume
        source: caddy-config
        target: /config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - console-net

  # Minute scheduler: drives due cron automations AND the expired-lease sweep
  # (recovers runs orphaned by an offline edge). The cron endpoint is authenticated
  # by WORK_AUTOMATION_CRON_SECRET; the scheduler reaches web over console-net.
  scheduler:
    image: alpine:3
    restart: unless-stopped
    logging: *prod-logging
    depends_on:
      hermes-console-web:
        condition: service_healthy
    environment:
      WORK_AUTOMATION_CRON_SECRET: ${WORK_AUTOMATION_CRON_SECRET:?set WORK_AUTOMATION_CRON_SECRET}
    command:
      - sh
      - -c
      # Toutes les lignes à la MÊME indentation : dans un bloc replié, une ligne
      # plus indentée garde ses retours à la ligne, ce qui coupait la commande
      # juste avant `|| echo` (« sh: syntax error: unexpected "||" ») et faisait
      # boucler le conteneur sans qu'aucun tick cron ne parte.
      - >-
        apk add --no-cache curl >/dev/null &&
        while true; do
        curl -fsS -m 30 -X POST
        -H "Authorization: Bearer $${WORK_AUTOMATION_CRON_SECRET}"
        http://hermes-console-web:3000/api/internal/work/automations/cron >/dev/null
        || echo "scheduler: cron tick failed";
        sleep 60;
        done
    networks:
      - console-net

  # One-shot schema migration. Gated behind a profile so it never runs on a plain
  # `up -d`. It reaches Postgres over console-net (the DB publishes no host port),
  # and the repo bind-mount gives it the versioned SQL in apps/web/drizzle:
  #   docker compose --project-directory . -f infra/prod/compose.console.yaml \
  #     --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    image: oven/bun:1.3-alpine
    working_dir: /repo
    logging: *prod-logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - type: bind
        source: .
        target: /repo
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run db:migrate"]
    restart: "no"
    networks:
      - console-net

  # Comptes de démonstration owner et member (mot de passe public, sans organisation :
  # elle se crée via /onboarding). Même garde que migrate : un profil, donc jamais
  # lancé par un `up -d`. Le seed n'écrit que dans la base, mais garde le .env complet
  # — SEED_DEMO_PASSWORD y remplace le mot de passe public :
  #   docker compose --project-directory . -f infra/prod/compose.console.yaml \
  #     --profile seed-demo run --rm seed-demo
  seed-demo:
    profiles: ["seed-demo"]
    image: oven/bun:1.3-alpine
    working_dir: /repo
    logging: *prod-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - type: bind
        source: .
        target: /repo
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run db:seed:demo"]
    restart: "no"
    networks:
      - console-net

networks:
  console-net:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  uploads-data:

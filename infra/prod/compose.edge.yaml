name: hermes-console-edge

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "5"
    compress: "true"

services:
  edge:
    build:
      context: .
      dockerfile: infra/prod/gateway.Dockerfile
    restart: unless-stopped
    logging: *prod-logging
    # Linux host networking reaches a systemwide Hermes dashboard still bound to 127.0.0.1.
    network_mode: host
    user: "${HERMES_UID:?set HERMES_UID}:${HERMES_GID:?set HERMES_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/hermes-gateway", "healthcheck", "http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - type: bind
        source: ${HERMES_SYSTEM_HOME:?set HERMES_SYSTEM_HOME explicitly}
        target: /opt/hermes-data
        read_only: true
      - type: bind
        source: ${HERMES_EDGE_IDENTITY_DIR:-./data/edge-identity}
        target: /var/lib/hermes-console/identity
    environment:
      HERMES_GATEWAY_MODE: edge
      HERMES_GATEWAY_ENV: ${HERMES_GATEWAY_ENV:-production}
      HERMES_LOG_LEVEL: ${HERMES_LOG_LEVEL:-info}
      HERMES_LOG_FORMAT: ${HERMES_LOG_FORMAT:-json}
      HERMES_GATEWAY_LISTEN: 127.0.0.1:8787
      HERMES_EDGE_LOCAL_URL: http://127.0.0.1:8787
      HERMES_RUNTIME_URL: ${HERMES_RUNTIME_URL:-http://127.0.0.1:9119}
      HERMES_RUNTIME_WS: ${HERMES_RUNTIME_WS:-ws://127.0.0.1:9119/api/ws}
      HERMES_RUNTIME_TOKEN: ${HERMES_RUNTIME_TOKEN:?set HERMES_RUNTIME_TOKEN}
      HERMES_RUNTIME_KIND: systemwide
      HERMES_HOME: /opt/hermes-data
      HERMES_IDENTITY_DIR: /var/lib/hermes-console/identity
      HERMES_ALLOWED_ORIGINS: ${HERMES_ALLOWED_ORIGINS:?set HERMES_ALLOWED_ORIGINS}
      HERMES_GATEWAY_CONTROL_MODE: disabled
      HERMES_SESSION_CHANGE_DEBOUNCE_MS: ${HERMES_SESSION_CHANGE_DEBOUNCE_MS:-200}
      HERMES_SESSION_RECONCILE_MS: ${HERMES_SESSION_RECONCILE_MS:-30000}
      HERMES_RELAY_SERVER_CA: ${HERMES_RELAY_SERVER_CA:-}

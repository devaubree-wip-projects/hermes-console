name: ci

# Déclenchement automatique rétabli (28-07-2026) : la Console va porter les
# données de plusieurs entreprises clientes, et une régression qui n'est vue
# qu'au déploiement se paie alors chez le client. Le coût en minutes Actions est
# accepté en connaissance de cause.
on:
  pull_request:
  push:
    branches: [main, "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No DATABASE_URL here: this job runs unit tests + build with no Postgres
    # service. DB-backed integration tests (e.g. *.integration.test.ts) key off
    # DATABASE_URL and self-skip when it is unset; they are meant to run against
    # a provisioned DB (locally, or a future CI job with a Postgres service).
    # Setting DATABASE_URL without a reachable DB makes them fail (ECONNREFUSED).
    env:
      HERMES_GATEWAY_TICKET_SECRET: ci-ticket-secret-at-least-24-characters
      HERMES_GATEWAY_SERVICE_SECRET: ci-service-secret-at-least-24-characters
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run contracts:verify
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build:shared
      - run: bun run build:web

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/gateway/go.mod
          cache-dependency-path: apps/gateway/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run test:gateway
      - run: bun run build:gateway

  web-db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_console
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes_console"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://hermes:hermes@127.0.0.1:5432/hermes_console
      HERMES_GATEWAY_TICKET_SECRET: ci-ticket-secret-at-least-24-characters
      HERMES_GATEWAY_SERVICE_SECRET: ci-service-secret-at-least-24-characters
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # Fresh database provisioned exclusively through the versioned migrations,
      # so the production migration path is exercised on every PR.
      - run: bun run db:migrate
      - run: bun run test:web

  telegram-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 -m unittest apps/web/hermes-extensions/hermes-console-control/test_plugin.py

  docker-images:
    # The server install builds these two images on the target host. Nothing else
    # in this workflow touches the Dockerfiles, so until now a production build
    # could only break at deploy time, on the server, with the stack half up.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build the Console image
        run: docker build -f apps/web/Dockerfile -t hermes-console-web:ci .
      - name: Build the Edge image
        run: docker build -f infra/prod/gateway.Dockerfile -t hermes-console-edge:ci .
      - name: Check the production compose files parse with the built images
        run: |
          set -euo pipefail
          # Les services déclarent `env_file: .env`, que le dépôt ne versionne
          # pas : sans lui, `config` échoue avant d'avoir rien validé. L'exemple
          # tient le rôle, et au passage on vérifie qu'il reste analysable.
          cp .env.example .env
          docker compose --project-directory . \
            -f infra/prod/compose.console.yaml -f infra/prod/compose.runtime.yaml config >/dev/null
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: hermes_console
          HERMES_CONSOLE_DOMAIN: ci.example.invalid
          WORK_AUTOMATION_CRON_SECRET: ci-cron-secret
          HERMES_RUNTIME_TOKEN: ci-runtime-token
          HERMES_GATEWAY_TICKET_SECRET: ci-ticket-secret-at-least-24-characters
          HERMES_GATEWAY_SERVICE_SECRET: ci-service-secret-at-least-24-characters
          HERMES_BACKUP_ENCRYPTION_KEY: ci-backup-key-at-least-32-characters-long

  canary-smoke:
    # Pre-merge browser-e2e gate on integration/** and on-demand. Kept off main
    # pushes: the suite has pre-existing flakiness (composer/installations/work
    # specs) and adds ~7min; per-push DB + migration coverage lives in
    # web-db-integration instead. Address the e2e debt on an integration branch,
    # then re-enable on main.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_console
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes_console"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://hermes:hermes@127.0.0.1:5432/hermes_console
      HERMES_GATEWAY_TICKET_SECRET: ci-ticket-secret-at-least-24-characters
      HERMES_GATEWAY_SERVICE_SECRET: ci-service-secret-at-least-24-characters
      HERMES_GATEWAY_DERIVE_SECRETS: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # Provision via the versioned migrator (deterministic, no runtime drizzle-kit
      # fetch — `db:push` pulled an incompatible drizzle-kit and failed). The e2e
      # seed re-runs the legacy migration scripts idempotently on top.
      - run: bun run db:migrate
      # The e2e run needs the Playwright browser; the job never installed it, so
      # every spec failed with "Executable doesn't exist".
      - run: bun --cwd=apps/web x playwright install --with-deps chromium
      - run: bun run test:e2e
